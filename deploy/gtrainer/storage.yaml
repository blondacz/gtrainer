apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gtrainer-data
  annotations:
    # Git removal/pruning must not silently erase records.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
