# Local Intel Mac benchmark cluster. No host filesystem mounts or Pi membership.
minimumLimaVersion: 2.2.1
vmType: vz
arch: x86_64
cpus: 4
memory: 8GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 11434
    hostPort: 11435
    hostIP: 127.0.0.1
  - guestPortRange: [1, 65535]
    ignore: true
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      if [ ! -x /usr/local/bin/k3s ]; then
        curl --fail --location --retry 3 'https://github.com/k3s-io/k3s/releases/download/v1.37.1%2Bk3s1/k3s' -o /usr/local/bin/k3s.download
        echo '92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0  /usr/local/bin/k3s.download' | sha256sum --check
        install -m 0755 /usr/local/bin/k3s.download /usr/local/bin/k3s
        rm /usr/local/bin/k3s.download
      fi
      mkdir -p /etc/rancher/k3s
      cat > /etc/rancher/k3s/config.yaml <<'EOF'
      node-name: gtrainer-mac-vm
      write-kubeconfig-mode: "0600"
      disable:
        - traefik
        - servicelb
        - metrics-server
      EOF
      cat > /etc/systemd/system/k3s.service <<'EOF'
      [Unit]
      Description=Gtrainer local K3s
      Wants=network-online.target
      After=network-online.target
      [Service]
      Type=notify
      ExecStart=/usr/local/bin/k3s server
      KillMode=process
      Delegate=yes
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
      systemctl enable --now k3s
probes:
  - script: |
      #!/bin/sh
      sudo /usr/local/bin/k3s kubectl wait --for=condition=Ready node/gtrainer-mac-vm --timeout=30s
    hint: Check `sudo journalctl -u k3s` inside the VM.
