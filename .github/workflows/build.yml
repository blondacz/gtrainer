name: Build and publish ARM64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Gradle wrapper integrity
        run: echo '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Run all builds and synthetic tests
        run: bash scripts/check.sh

  publish:
    name: Publish and verify ARM64 image
    needs: checks
    # No package writes for pull requests or untrusted/non-main branches.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Refuse an existing public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_package_visibility.py --allow-missing
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/blondacz/gtrainer:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/blondacz/gtrainer
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify package remained private
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_package_visibility.py
      - name: Run the published ARM64 image by immutable digest
        env:
          IMAGE: ghcr.io/blondacz/gtrainer@${{ steps.image.outputs.digest }}
        run: bash scripts/verify_arm64_image.sh
      - name: Record verified immutable image reference
        env:
          IMAGE: ghcr.io/blondacz/gtrainer@${{ steps.image.outputs.digest }}
        run: printf 'Verified image `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
